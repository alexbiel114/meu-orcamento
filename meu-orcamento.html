<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --ink: #1F2A24;
    --paper: #F3F0E7;
    --line: #D9D2C0;
    --muted: #6B6455;
    --alert: #B3462C;
    --essencial: #3B5249;
    --lazer: #C8952B;
    --poupar: #35707A;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--paper); color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh; min-height: 100dvh;
  }
  body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  .orc-wrap { max-width: 680px; margin: 0 auto; padding: 40px 24px 64px; }
  .orc-title { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .orc-sub { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
  .orc-hr { border: none; border-top: 1px solid var(--line); margin: 28px 0; }
  .orc-num { font-family: 'Fraunces', serif; font-variant-numeric: tabular-nums; }
  .orc-input {
    font-family: 'Inter', sans-serif; font-size: 15px; border: none; border-bottom: 1px solid var(--line);
    background: transparent; padding: 4px 2px; color: var(--ink); width: 100%; outline: none; min-width: 0;
  }
  .orc-input:focus { border-bottom-color: var(--ink); }
  .orc-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .orc-row:last-child { border-bottom: none; }
  .orc-bar-track { height: 8px; background: #E8E3D6; border-radius: 4px; overflow: hidden; }
  .orc-bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease; }
  .orc-cat-label { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.02em; }
  .orc-reset { background: none; border: none; color: var(--muted); font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0; }
  .orc-x {
    border: none; background: none; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 4px;
  }
  .orc-x:hover { color: var(--alert); }
  .orc-btn {
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; border: 1px solid var(--ink);
    background: var(--ink); color: var(--paper); padding: 7px 14px; border-radius: 3px; cursor: pointer; flex: 0 0 auto;
  }
  .orc-btn:hover { opacity: 0.85; }
  .orc-add-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .orc-add-row .orc-input { flex: 1 1 160px; }

  /* Charts */
  .orc-charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 12px; align-items: start; }
  .orc-chart-box { min-width: 0; }
  .orc-chart-title { font-size: 12px; color: var(--muted); margin-bottom: 8px; text-align: center; }
  .orc-donut-wrap { display: flex; flex-direction: column; align-items: center; }
  .orc-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 14px; margin-top: 10px; font-size: 12px; }
  .orc-legend-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .orc-bars { display: flex; justify-content: space-around; align-items: flex-end; height: 150px; padding: 0 4px; }
  .orc-bar-group { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; }
  .orc-bar-pair { display: flex; align-items: flex-end; gap: 4px; height: 120px; }
  .orc-bar-col { width: 16px; border-radius: 3px 3px 0 0; transition: height 0.4s ease; min-height: 2px; }
  .orc-bar-cat-label { font-size: 11px; color: var(--muted); text-align: center; }
  .orc-bars-legend { display: flex; justify-content: center; gap: 16px; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .orc-swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }

  .orc-legend-row { display: flex; justify-content: space-between; margin-top: 4px; font-size: 13px; flex-wrap: wrap; gap: 8px; }

  @media (max-width: 520px) {
    .orc-wrap { padding: 24px 16px 48px; }
    .orc-title { font-size: 24px; }
    .orc-charts { grid-template-columns: 1fr; }
    .orc-row { flex-wrap: wrap; }
    .orc-row > input { max-width: 100% !important; text-align: left !important; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
  const CATS = {
    Essencial: { label: "Essencial", pct: 50, color: "#3B5249" },
    Lazer: { label: "Lazer", pct: 30, color: "#C8952B" },
    Poupar: { label: "Poupar", pct: 20, color: "#35707A" },
  };
  const ALERT = "#B3462C";

  function seedExpenses() {
    return [
      { id: "e1", descricao: "Compras", valor: 0, categoria: "Essencial" },
      { id: "e2", descricao: "Luz", valor: 0, categoria: "Essencial" },
      { id: "e3", descricao: "Internet", valor: 0, categoria: "Essencial" },
      { id: "e4", descricao: "Gás", valor: 0, categoria: "Essencial" },
      { id: "e5", descricao: "Água", valor: 0, categoria: "Essencial" },
      { id: "e6", descricao: "Empréstimo", valor: 0, categoria: "Essencial" },
      { id: "e7", descricao: "Cartão Nu", valor: 0, categoria: "Lazer" },
      { id: "e8", descricao: "Cartão Inter", valor: 0, categoria: "Lazer" },
      { id: "e9", descricao: "Reserva de emergência", valor: 0, categoria: "Poupar" },
    ];
  }

  function brl(n) {
    n = isFinite(n) ? n : 0;
    return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  }

  function uid() {
    return Math.random().toString(36).slice(2, 9);
  }

  const state = {
    ready: false,
    salarioBruto: 0,
    salarioRecebido: 0,
    dizimoPercent: 10,
    expenses: [],
    drafts: { Essencial: "", Lazer: "", Poupar: "" },
    draftValues: { Essencial: "", Lazer: "", Poupar: "" },
    storageOk: true,
  };

  async function loadData() {
    try {
      const cfg = await window.storage.get("orcamento-config");
      if (cfg) {
        const p = JSON.parse(cfg.value);
        state.salarioBruto = p.salarioBruto ?? 0;
        state.salarioRecebido = p.salarioRecebido ?? 0;
        state.dizimoPercent = p.dizimoPercent ?? 10;
      }
    } catch (e) { /* sem configuração salva ainda */ }

    try {
      const exp = await window.storage.get("orcamento-expenses");
      state.expenses = exp ? JSON.parse(exp.value) : seedExpenses();
    } catch (e) {
      state.expenses = seedExpenses();
    }

    state.ready = true;
    render();
  }

  async function saveConfig() {
    try {
      const ok = await window.storage.set("orcamento-config", JSON.stringify({
        salarioBruto: state.salarioBruto,
        salarioRecebido: state.salarioRecebido,
        dizimoPercent: state.dizimoPercent,
      }));
      if (!ok) state.storageOk = false;
    } catch (e) { state.storageOk = false; }
  }

  async function saveExpenses() {
    try {
      const ok = await window.storage.set("orcamento-expenses", JSON.stringify(state.expenses));
      if (!ok) state.storageOk = false;
    } catch (e) { state.storageOk = false; }
  }

  function gastoPorCategoria(cat) {
    return state.expenses
      .filter((e) => e.categoria === cat)
      .reduce((s, e) => s + (parseFloat(e.valor) || 0), 0);
  }

  function dizimoValor() {
    return (state.dizimoPercent / 100) * state.salarioBruto;
  }

  function salarioLiquidoCalc() {
    return state.salarioRecebido - dizimoValor();
  }

  function orcadoPorCategoria(cat) {
    return (salarioLiquidoCalc() * CATS[cat].pct) / 100;
  }

  function addExpense(cat) {
    const desc = (state.drafts[cat] || "").trim();
    const valor = parseFloat((state.draftValues[cat] || "0").replace(",", "."));
    if (!desc || !isFinite(valor)) return;
    state.expenses.push({ id: uid(), descricao: desc, valor, categoria: cat });
    state.drafts[cat] = "";
    state.draftValues[cat] = "";
    saveExpenses();
    render();
  }

  function removeExpense(id) {
    state.expenses = state.expenses.filter((e) => e.id !== id);
    saveExpenses();
    render();
  }

  function commitFieldChange() {
    saveConfig();
    render();
  }

  function commitExpenseValor() {
    saveExpenses();
    render();
  }

  function resetAll() {
    state.salarioBruto = 0;
    state.salarioRecebido = 0;
    state.dizimoPercent = 10;
    state.expenses = seedExpenses();
    saveConfig();
    saveExpenses();
    render();
  }

  // ---------- Gráficos ----------

  function buildDonut() {
    const r = 60, cx = 80, cy = 80, stroke = 22;
    const circumference = 2 * Math.PI * r;
    let acc = 0;
    const cats = Object.keys(CATS);
    const arcs = cats.map((cat) => {
      const pct = CATS[cat].pct;
      const len = (pct / 100) * circumference;
      const gap = circumference - len;
      const rotate = -90 + (acc / 100) * 360;
      acc += pct;
      return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${CATS[cat].color}"
        stroke-width="${stroke}" stroke-dasharray="${len} ${gap}"
        transform="rotate(${rotate} ${cx} ${cy})" />`;
    }).join("");

    return `
      <svg viewBox="0 0 160 160" width="160" height="160">${arcs}</svg>
      <div class="orc-legend">
        ${cats.map((cat) => `
          <span><span class="orc-legend-dot" style="background:${CATS[cat].color}"></span>${CATS[cat].label} ${CATS[cat].pct}%</span>
        `).join("")}
      </div>
    `;
  }

  function buildBars() {
    const cats = Object.keys(CATS);
    const data = cats.map((cat) => ({
      cat,
      orcado: orcadoPorCategoria(cat),
      gasto: gastoPorCategoria(cat),
      color: CATS[cat].color,
    }));
    const maxVal = Math.max(1, ...data.map((d) => Math.max(d.orcado, d.gasto)));
    const maxHeight = 120;

    const groups = data.map((d) => {
      const hOrcado = Math.max(2, (d.orcado / maxVal) * maxHeight);
      const hGasto = Math.max(2, (d.gasto / maxVal) * maxHeight);
      return `
        <div class="orc-bar-group">
          <div class="orc-bar-pair" title="Orçado: ${brl(d.orcado)} · Gasto: ${brl(d.gasto)}">
            <div class="orc-bar-col" style="height:${hOrcado}px; background:${d.color}; opacity:0.32;"></div>
            <div class="orc-bar-col" style="height:${hGasto}px; background:${d.color};"></div>
          </div>
          <div class="orc-bar-cat-label">${CATS[d.cat].label}</div>
        </div>
      `;
    }).join("");

    return `
      <div class="orc-bars">${groups}</div>
      <div class="orc-bars-legend">
        <span><span class="orc-swatch" style="background:#999; opacity:0.35;"></span>Orçado</span>
        <span><span class="orc-swatch" style="background:#999;"></span>Gasto</span>
      </div>
    `;
  }

  // ---------- Renderização ----------

  function render() {
    const app = document.getElementById("app");
    const temRenda = salarioLiquidoCalc() > 0;

    app.innerHTML = `
      <div class="orc-wrap">
        <h1 class="orc-title">Meu orçamento</h1>
        <p class="orc-sub">Regra 50/30/20 sobre o salário líquido — 50% para o essencial, 30% para o lazer, 20% para poupar.</p>

        <hr class="orc-hr" />

        <div>
          <div class="orc-cat-label" style="color:var(--muted); margin-bottom:10px;">Renda</div>
          <div class="orc-row">
            <span>Contracheque (salário bruto)</span>
            <input class="orc-input" id="in-salarioBruto" style="max-width:140px; text-align:right;" type="number"
              value="${state.salarioBruto || ""}" placeholder="R$ 0,00" />
          </div>
          <div class="orc-row">
            <span>Salário recebido</span>
            <input class="orc-input" id="in-salarioRecebido" style="max-width:140px; text-align:right;" type="number"
              value="${state.salarioRecebido || ""}" placeholder="R$ 0,00" />
          </div>
          <div class="orc-row">
            <span>Salário líquido <span style="color:var(--muted); font-size:12px;">(recebido − dízimo)</span></span>
            <span class="orc-num">${brl(salarioLiquidoCalc())}</span>
          </div>
          <div class="orc-row">
            <span>Dízimo <span style="color:var(--muted); font-size:12px;">(% do contracheque)</span></span>
            <input class="orc-input" id="in-dizimoPercent" style="max-width:60px; text-align:right;" type="number"
              value="${state.dizimoPercent}" />
          </div>
          <div class="orc-row">
            <span style="color:var(--muted);">Valor do dízimo</span>
            <span class="orc-num">${brl(dizimoValor())}</span>
          </div>
        </div>

        <hr class="orc-hr" />

        ${!temRenda ? `
          <p style="color:var(--muted); font-size:14px;">
            Informe seu salário líquido acima para calcular a divisão do orçamento.
          </p>
        ` : `
          <div>
            <div class="orc-num" style="font-size:40px; margin-bottom:4px;">${brl(salarioLiquidoCalc())}</div>
            <div style="color:var(--muted); font-size:13px; margin-bottom:8px;">salário líquido dividido em três blocos</div>

            <div class="orc-charts">
              <div class="orc-chart-box">
                <div class="orc-chart-title">Alocação planejada</div>
                <div class="orc-donut-wrap">${buildDonut()}</div>
              </div>
              <div class="orc-chart-box">
                <div class="orc-chart-title">Orçado x gasto</div>
                ${buildBars()}
              </div>
            </div>

            <div class="orc-legend-row">
              ${Object.keys(CATS).map((cat) => `
                <div style="color:var(--muted);">
                  <span style="color:${CATS[cat].color}; font-weight:600;">${CATS[cat].label}</span>
                  ${brl(orcadoPorCategoria(cat))}
                </div>
              `).join("")}
            </div>
          </div>
        `}

        ${Object.keys(CATS).map((cat) => {
          const orcado = orcadoPorCategoria(cat);
          const gasto = gastoPorCategoria(cat);
          const pctUsado = orcado > 0 ? Math.min((gasto / orcado) * 100, 100) : 0;
          const estourou = orcado > 0 && gasto > orcado;
          const itens = state.expenses.filter((e) => e.categoria === cat);

          return `
            <hr class="orc-hr" />
            <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;">
              <span class="orc-cat-label" style="color:${CATS[cat].color};">${CATS[cat].label.toUpperCase()}</span>
              <span style="font-size:13px; color:${estourou ? ALERT : "var(--muted)"};">
                ${brl(gasto)} de ${brl(orcado)}${estourou ? " · acima do orçado" : ""}
              </span>
            </div>
            <div class="orc-bar-track">
              <div class="orc-bar-fill" style="width:${pctUsado}%; background:${estourou ? ALERT : CATS[cat].color};"></div>
            </div>

            <div style="margin-top:6px;">
              ${itens.map((e) => `
                <div class="orc-row">
                  <span>${e.descricao}</span>
                  <span style="display:flex; align-items:center; gap:8px; flex-shrink:0;">
                    <input class="orc-input orc-num exp-valor" data-id="${e.id}" style="width:110px; text-align:right;"
                      type="number" value="${e.valor || ""}" placeholder="R$ 0,00" />
                    <button class="orc-x remove-exp" data-id="${e.id}" aria-label="Remover">×</button>
                  </span>
                </div>
              `).join("")}
            </div>

            <div class="orc-add-row">
              <input class="orc-input draft-desc" data-cat="${cat}" placeholder="Novo gasto em ${CATS[cat].label.toLowerCase()}"
                value="${state.drafts[cat]}" />
              <input class="orc-input draft-valor" data-cat="${cat}" style="max-width:100px;" placeholder="Valor"
                value="${state.draftValues[cat]}" />
              <button class="orc-btn add-btn" data-cat="${cat}">Adicionar</button>
            </div>
          `;
        }).join("")}

        <hr class="orc-hr" />
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:12px; color:var(--muted);">
            ${state.ready ? "Seus dados ficam salvos neste app." : "Carregando..."}
            ${!state.storageOk ? " Não foi possível salvar agora — os dados podem se perder ao recarregar." : ""}
          </span>
          <button class="orc-reset" id="reset-btn">Limpar tudo</button>
        </div>
      </div>
    `;

    attachEvents();
  }

  function attachEvents() {
    const bind = (id, field) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener("input", (e) => { state[field] = parseFloat(e.target.value) || 0; });
      el.addEventListener("blur", commitFieldChange);
      el.addEventListener("keydown", (e) => { if (e.key === "Enter") el.blur(); });
    };
    bind("in-salarioBruto", "salarioBruto");
    bind("in-salarioRecebido", "salarioRecebido");
    bind("in-dizimoPercent", "dizimoPercent");

    document.querySelectorAll(".exp-valor").forEach((el) => {
      el.addEventListener("input", (e) => {
        const id = e.target.getAttribute("data-id");
        const item = state.expenses.find((x) => x.id === id);
        if (item) item.valor = parseFloat(e.target.value) || 0;
      });
      el.addEventListener("blur", commitExpenseValor);
      el.addEventListener("keydown", (e) => { if (e.key === "Enter") e.target.blur(); });
    });

    document.querySelectorAll(".remove-exp").forEach((el) => {
      el.addEventListener("click", (e) => removeExpense(e.target.getAttribute("data-id")));
    });

    document.querySelectorAll(".draft-desc").forEach((el) => {
      el.addEventListener("input", (e) => { state.drafts[e.target.getAttribute("data-cat")] = e.target.value; });
      el.addEventListener("keydown", (e) => { if (e.key === "Enter") addExpense(e.target.getAttribute("data-cat")); });
    });
    document.querySelectorAll(".draft-valor").forEach((el) => {
      el.addEventListener("input", (e) => { state.draftValues[e.target.getAttribute("data-cat")] = e.target.value; });
      el.addEventListener("keydown", (e) => { if (e.key === "Enter") addExpense(e.target.getAttribute("data-cat")); });
    });
    document.querySelectorAll(".add-btn").forEach((el) => {
      el.addEventListener("click", (e) => addExpense(e.target.getAttribute("data-cat")));
    });

    const resetBtn = document.getElementById("reset-btn");
    if (resetBtn) resetBtn.addEventListener("click", resetAll);
  }

  loadData();

  // Service worker mínimo (inline), necessário em alguns navegadores para
  // habilitar a instalação do app na tela inicial (PWA).
  if ("serviceWorker" in navigator) {
    try {
      const swCode = "self.addEventListener('fetch', function(e) {});";
      const swBlob = new Blob([swCode], { type: "application/javascript" });
      const swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl).catch(function () {});
    } catch (e) { /* navegador não suporta ou bloqueou; segue sem SW */ }
  }
</script>
</body>
</html>
